server:
  port: 8082
  servlet:
    context-path: /post-service

spring:
  application:
    name: posts
  config:
    import: "optional:configserver:http://localhost:8071/"


  servlet:
    multipart:
      enabled: true
      max-file-size: 10MB
      max-request-size: 10MB


  web:
    resources:
      static-locations: file:uploads/

file:
  upload-dir: uploads/

