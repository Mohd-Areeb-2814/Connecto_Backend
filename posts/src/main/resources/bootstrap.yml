server:
  port: 8082
  servlet:
    context-path: /post-service

spring:
  application:
    name: posts
  config:
    import: "optional:configserver:http://localhost:8071/"


  servlet:
    multipart:
      enabled: true
      max-file-size: 10MB
      max-request-size: 10MB


  web:
    resources:
      static-locations: file:uploads/

file:
  upload-dir: uploads/




management:
  endpoints:
    web:
      exposure:
        include: "*"
  endpoint:
    shutdown:
      enabled: true
  info:
    env:
      enabled: true


endpoints:
  shutdown:
    enabled: true



eureka:
  instance:
    preferIpAddress: true
  client:
    fetchRegistry: true
    registerWithEureka: true
    serviceUrl:
      defaultZone: http://localhost:8070/eureka/


info:
  app:
    name: "posts"
    description: "Connecto Posts Application"
    version: "1.0.0"
